# Déploiement Netlify : le site est entièrement statique (dossier out/).
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # site entièrement statique (dossier out/) : le module Next.js de Netlify ne doit pas s'en mêler
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# les références sont désormais sur l'accueil, sous les projets
[[redirects]]
  from = "/:lang/references/*"
  to = "/:lang/#references"
  status = 301
[[redirects]]
  from = "/:lang/references"
  to = "/:lang/#references"
  status = 301
